# Nixpacks configuration for Laravel 12 on Railway
[variables]
NIXPACKS_PHP_VERSION = "8.4"

[phases.setup]
nixPkgs = [
  "php84",
  "php84Packages.composer",
  "php84Extensions.pdo_pgsql",
  "php84Extensions.pgsql",
  "php84Extensions.mbstring",
  "php84Extensions.openssl",
  "php84Extensions.curl",
  "php84Extensions.zip",
  "nodejs_22"
]

[phases.install]
cmds = [
  "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
  "npm ci --ignore-scripts"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan storage:link && php artisan migrate --force --seed && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
